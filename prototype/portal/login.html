    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login - Customer Portal | Silent Disco Headsets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/portal.css">
    <style>
        .otp-inputs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin: 1.5rem 0;
        }
        .otp-inputs input {
            width: 48px;
            height: 56px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            border: 2px solid #e5e5e7;
            border-radius: var(--border-radius);
            transition: border-color 0.2s;
        }
        .otp-inputs input:focus {
            outline: none;
            border-color: var(--purple-dark);
        }
    </style>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="/">
                    <img src="../images/logo-dark.png" alt="Silent Disco Headsets" onerror="this.style.display='none'">
                </a>
                <h1>Customer Portal</h1>
            </div>

            <!-- Step 1: Email Entry -->
            <div id="step-email">
                <div class="auth-title">
                    <h2>Welcome Back</h2>
                    <p>Enter your email to receive a sign-in code</p>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="you@company.com">
                        <div class="form-hint">We'll send you a 6-digit code to sign in</div>
                        <div class="form-error" id="email-error"></div>
                    </div>

                    <div class="form-error" id="form-error" style="text-align: center; margin-bottom: 1rem;"></div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="login-btn">
                            <span class="btn-text">Send Code</span>
                            <span class="btn-loading" style="display: none;">Sending...</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Step 2: OTP Code Entry -->
            <div id="step-code" style="display: none; text-align: center;">
                <div style="width: 64px; height: 64px; margin: 0 auto 1rem; background: rgba(34, 197, 94, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
                <h3 style="margin-bottom: 0.5rem;">Enter Your Code</h3>
                <p style="color: var(--gray-medium); margin-bottom: 0.5rem;">We've sent a 6-digit code to</p>
                <p style="font-weight: 600; margin-bottom: 0;" id="sent-email"></p>

                <div class="otp-inputs" id="otp-inputs">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                </div>

                <div class="form-error" id="otp-error" style="text-align: center; margin-bottom: 1rem;"></div>

                <button type="button" class="btn btn-primary" id="verify-btn" disabled style="width: 100%;">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loading" style="display: none;">Verifying...</span>
                </button>

                <p style="color: var(--gray-medium); font-size: 0.875rem; margin-top: 1.5rem;">
                    Didn't receive it? <button type="button" id="resend-btn" style="background: none; border: none; color: var(--purple-dark); font-weight: 600; cursor: pointer; font-size: 0.875rem; padding: 0;">Resend code</button>
                </p>
                <button type="button" id="back-btn" style="background: none; border: none; color: var(--gray-medium); cursor: pointer; font-size: 0.875rem; padding: 0; margin-top: 0.5rem;">Use a different email</button>
            </div>

            <div class="form-footer">
                <p>Don't have an account? <a href="register.html">Create one</a></p>
                <p style="margin-top: 1rem;"><a href="/" style="color: var(--gray-medium);">Back to main site</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if already logged in
            const user = await Auth.getCurrentUser();
            if (user) {
                const profile = await Auth.getCurrentProfile();
                if (profile?.is_admin) {
                    window.location.href = 'admin/index.html';
                } else {
                    window.location.href = 'orders.html';
                }
                return;
            }

            let currentEmail = '';

            const stepEmail = document.getElementById('step-email');
            const stepCode = document.getElementById('step-code');
            const form = document.getElementById('login-form');
            const loginBtn = document.getElementById('login-btn');
            const btnText = loginBtn.querySelector('.btn-text');
            const btnLoading = loginBtn.querySelector('.btn-loading');
            const sentEmailSpan = document.getElementById('sent-email');
            const verifyBtn = document.getElementById('verify-btn');
            const resendBtn = document.getElementById('resend-btn');
            const backBtn = document.getElementById('back-btn');
            const otpInputs = document.querySelectorAll('#otp-inputs input');

            // OTP input behavior: auto-advance, paste support
            otpInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const val = e.target.value.replace(/[^0-9]/g, '');
                    e.target.value = val;
                    if (val && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                    checkOtpComplete();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                });

                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                    otpInputs.forEach((inp, i) => {
                        inp.value = paste[i] || '';
                    });
                    const lastFilled = Math.min(paste.length, otpInputs.length) - 1;
                    if (lastFilled >= 0) otpInputs[Math.min(lastFilled + 1, otpInputs.length - 1)].focus();
                    checkOtpComplete();
                });
            });

            function checkOtpComplete() {
                const code = getOtpCode();
                verifyBtn.disabled = code.length !== 6;
            }

            function getOtpCode() {
                return Array.from(otpInputs).map(i => i.value).join('');
            }

            function clearOtp() {
                otpInputs.forEach(i => i.value = '');
                verifyBtn.disabled = true;
                document.getElementById('otp-error').textContent = '';
            }

            // Step 1: Send OTP code
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                document.getElementById('email-error').textContent = '';
                document.getElementById('form-error').textContent = '';

                const email = document.getElementById('email').value.trim();
                if (!email) {
                    document.getElementById('email-error').textContent = 'Email is required';
                    return;
                }

                btnText.style.display = 'none';
                btnLoading.style.display = 'inline';
                loginBtn.disabled = true;

                try {
                    await Auth.signInWithOTP(email);
                    currentEmail = email;
                    sentEmailSpan.textContent = email;
                    stepEmail.style.display = 'none';
                    stepCode.style.display = 'block';
                    otpInputs[0].focus();
                } catch (error) {
                    document.getElementById('form-error').textContent = error.message || 'Failed to send code. Please try again.';
                    btnText.style.display = 'inline';
                    btnLoading.style.display = 'none';
                    loginBtn.disabled = false;
                }
            });

            // Step 2: Verify OTP code
            verifyBtn.addEventListener('click', async () => {
                const code = getOtpCode();
                if (code.length !== 6) return;

                const vBtnText = verifyBtn.querySelector('.btn-text');
                const vBtnLoading = verifyBtn.querySelector('.btn-loading');
                vBtnText.style.display = 'none';
                vBtnLoading.style.display = 'inline';
                verifyBtn.disabled = true;
                document.getElementById('otp-error').textContent = '';

                try {
                    const { data, error } = await supabaseClient.auth.verifyOtp({
                        email: currentEmail,
                        token: code,
                        type: 'email'
                    });

                    if (error) throw error;

                    // Success — redirect
                    const profile = await Auth.getCurrentProfile();
                    if (profile?.is_admin) {
                        window.location.href = 'admin/index.html';
                    } else if (profile?.onboarding_completed) {
                        window.location.href = 'orders.html';
                    } else {
                        window.location.href = 'onboarding.html';
                    }
                } catch (error) {
                    document.getElementById('otp-error').textContent = 'Invalid or expired code. Please try again.';
                    vBtnText.style.display = 'inline';
                    vBtnLoading.style.display = 'none';
                    verifyBtn.disabled = false;
                    clearOtp();
                    otpInputs[0].focus();
                }
            });

            // Resend code
            resendBtn.addEventListener('click', async () => {
                resendBtn.textContent = 'Sending...';
                resendBtn.disabled = true;
                try {
                    await Auth.signInWithOTP(currentEmail);
                    resendBtn.textContent = 'Code sent!';
                    setTimeout(() => {
                        resendBtn.textContent = 'Resend code';
                        resendBtn.disabled = false;
                    }, 3000);
                    clearOtp();
                    otpInputs[0].focus();
                } catch (error) {
                    resendBtn.textContent = 'Failed — try again';
                    resendBtn.disabled = false;
                }
            });

            // Back to email step
            backBtn.addEventListener('click', () => {
                stepCode.style.display = 'none';
                stepEmail.style.display = 'block';
                clearOtp();
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                loginBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
