<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login - Customer Portal | Silent Disco Headsets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/portal.css">
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="/">
                    <img src="../images/logo-dark.png" alt="Silent Disco Headsets" onerror="this.style.display='none'">
                </a>
                <h1>Customer Portal</h1>
            </div>

            <div class="auth-title">
                <h2>Welcome Back</h2>
                <p>Enter your email to receive a magic sign-in link</p>
            </div>

            <!-- Email Entry Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@company.com">
                    <div class="form-hint">We'll send you a secure link to sign in</div>
                    <div class="form-error" id="email-error"></div>
                </div>

                <div class="form-error" id="form-error" style="text-align: center; margin-bottom: 1rem;"></div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="login-btn">
                        <span class="btn-text">Send Magic Link</span>
                        <span class="btn-loading" style="display: none;">Sending...</span>
                    </button>
                </div>
            </form>

            <!-- Success Message (hidden initially) -->
            <div id="email-sent" style="display: none; text-align: center;">
                <div style="width: 64px; height: 64px; margin: 0 auto 1rem; background: rgba(34, 197, 94, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
                <h3 style="margin-bottom: 0.5rem;">Check Your Email!</h3>
                <p style="color: var(--gray-medium); margin-bottom: 1rem;">We've sent a magic link to <strong id="sent-email"></strong></p>
                <p style="color: var(--gray-medium); font-size: 0.875rem; margin-bottom: 1.5rem;">Click the link in the email to sign in. The link expires in 1 hour.</p>
                <button type="button" class="btn btn-secondary" id="try-again-btn">Send Another Link</button>
            </div>

            <div class="form-footer">
                <p>Don't have an account? <a href="register.html">Create one</a></p>
                <p style="margin-top: 1rem;"><a href="/" style="color: var(--gray-medium);">Back to main site</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if already logged in
            const user = await Auth.getCurrentUser();
            if (user) {
                const profile = await Auth.getCurrentProfile();
                if (profile?.is_admin) {
                    window.location.href = 'admin/index.html';
                } else {
                    window.location.href = 'orders.html';
                }
                return;
            }

            // Handle login form
            const form = document.getElementById('login-form');
            const loginBtn = document.getElementById('login-btn');
            const btnText = loginBtn.querySelector('.btn-text');
            const btnLoading = loginBtn.querySelector('.btn-loading');
            const emailSent = document.getElementById('email-sent');
            const sentEmailSpan = document.getElementById('sent-email');
            const tryAgainBtn = document.getElementById('try-again-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Clear errors
                document.getElementById('email-error').textContent = '';
                document.getElementById('form-error').textContent = '';

                const email = document.getElementById('email').value.trim();

                // Validate
                if (!email) {
                    document.getElementById('email-error').textContent = 'Email is required';
                    return;
                }

                // Show loading
                btnText.style.display = 'none';
                btnLoading.style.display = 'inline';
                loginBtn.disabled = true;

                try {
                    await Auth.signInWithOTP(email);

                    // Show success message
                    form.style.display = 'none';
                    emailSent.style.display = 'block';
                    sentEmailSpan.textContent = email;
                } catch (error) {
                    document.getElementById('form-error').textContent = error.message || 'Failed to send magic link. Please try again.';
                    btnText.style.display = 'inline';
                    btnLoading.style.display = 'none';
                    loginBtn.disabled = false;
                }
            });

            // Handle try again button
            tryAgainBtn.addEventListener('click', () => {
                form.style.display = 'block';
                emailSent.style.display = 'none';
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                loginBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
